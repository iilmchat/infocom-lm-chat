<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый клиент API Менеджер ИТ-проектов (v2.4)</title>
    <style>
        /* Тёмная тема, адаптивный дизайн */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1, h2 { color: #ffffff; margin-bottom: 16px; }
        .settings {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .settings label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 200px;
            color: #b0b0b0;
            font-size: 14px;
        }
        .settings input {
            background: #2c2c2c;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        .settings input:focus { outline: none; border-color: #6a9fb5; }
        .btn {
            background: #2a4c5a;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: #3a6a7a; }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: #3a3a3a; }
        .btn-secondary:hover { background: #4a4a4a; }

        /* Группы (аккордеон) */
        .group { margin-bottom: 20px; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; background: #1a1a1a; }
        .group-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: #252525; cursor: pointer; user-select: none;
            transition: background 0.2s;
        }
        .group-header:hover { background: #2f2f2f; }
        .group-header h3 { font-size: 18px; font-weight: 500; color: #d0d0d0; margin: 0; }
        .group-header .toggle-icon { font-size: 18px; transition: transform 0.3s; }
        .group-header .toggle-icon.collapsed { transform: rotate(-90deg); }
        .group-body {
            padding: 12px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 16px; transition: all 0.3s;
        }
        .group-body.hidden { display: none; }

        .endpoint-card {
            background: #1e1e1e; border-radius: 8px; padding: 16px;
            border-left: 4px solid #4a6a7a; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 10px;
        }
        .endpoint-header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .method {
            font-weight: bold; padding: 2px 10px; border-radius: 12px; font-size: 13px;
            background: #2a4c5a; color: #b8d8e8;
        }
        .method.get { background: #2a5a4a; color: #a0d8b0; }
        .method.post { background: #5a4a2a; color: #e8d8a0; }
        .method.put { background: #5a2a5a; color: #e8a0e8; }
        .url { font-family: 'Consolas', monospace; font-size: 13px; color: #b0b0b0; word-break: break-all; }
        .description { font-size: 14px; color: #c0c0c0; margin: 4px 0; }
        .params-area { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .params-area .param {
            display: flex; align-items: center; gap: 4px; background: #2a2a2a;
            padding: 2px 8px; border-radius: 4px; font-size: 13px;
        }
        .params-area .param label { color: #a0a0a0; }
        .params-area .param input {
            background: #121212; border: 1px solid #3a3a3a; color: #e0e0e0;
            padding: 4px 8px; border-radius: 4px; width: 120px; font-size: 13px;
        }
        .body-area { margin: 6px 0; display: flex; flex-direction: column; gap: 6px; }
        .body-area textarea {
            width: 100%; background: #121212; border: 1px solid #3a3a3a; color: #e0e0e0;
            padding: 8px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 13px;
            resize: vertical; min-height: 60px;
        }
        .body-area .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .button-row { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
        .response-block {
            background: #0d0d0d; border-radius: 4px; padding: 10px; margin-top: 8px;
            border: 1px solid #2a2a2a; overflow-x: auto; font-size: 13px;
        }
        .response-block .status { font-weight: bold; margin-bottom: 4px; }
        .response-block .time { color: #888; font-size: 12px; }
        .response-block .body { white-space: pre-wrap; word-break: break-word; font-family: 'Consolas', monospace; color: #b8d8e8; }
        .response-block.error { border-color: #6a2a2a; }
        .response-block.error .body { color: #e8a0a0; }
        .status-ok { color: #6fcf97; }
        .status-bad { color: #f28b82; }
        .loading {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid #3a6a7a; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }

        /* Подсветка JSON */
        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .boolean { color: #569cd6; }
        .null { color: #569cd6; }
        .key { color: #9cdcfe; }

        .history-section { margin-top: 30px; background: #1a1a1a; border-radius: 8px; padding: 16px; }
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
        .history-item {
            background: #252525; padding: 8px 12px; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; border-left: 3px solid #4a6a7a; cursor: pointer;
        }
        .history-item:hover { background: #2f2f2f; }
        .history-item .h-method { font-weight: bold; margin-right: 8px; }
        .history-item .h-url { color: #a0b0c0; flex: 1; margin: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-item .h-status { font-weight: bold; }
        .history-item .h-status.ok { color: #6fcf97; }
        .history-item .h-status.err { color: #f28b82; }
        .history-item .h-time { color: #888; font-size: 12px; margin-left: 12px; }

        .history-detail {
            background: #0d0d0d; border-radius: 4px; padding: 8px;
            margin-top: 4px; font-family: 'Consolas', monospace; font-size: 12px;
            white-space: pre-wrap; word-break: break-word;
            border: 1px solid #2a2a2a; max-height: 200px; overflow-y: auto;
        }

        @media (max-width: 600px) {
            .group-body { grid-template-columns: 1fr; }
            .settings { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

            // Примеры тел для эндпоинтов (ключ = url-шаблон)

                '/api/v1/projects/{projectId}/documents': { "type": "ИД", "title": "Техническое задание", "content": "Содержание документа..." },

            // ------------------- DOM элементы -------------------
            const serverInput = document.getElementById('serverUrl');
            const tokenInput = document.getElementById('token');
            const customHeadersInput = document.getElementById('customHeaders');
            const saveBtn = document.getElementById('saveSettingsBtn');
            const clearBtn = document.getElementById('clearSettingsBtn');
            const container = document.getElementById('endpointsContainer');
            const historyList = document.getElementById('historyList');

            // ------------------- Работа с localStorage -------------------
            function loadSettings() {
                const savedServer = localStorage.getItem('testClientServer');
                const savedToken = localStorage.getItem('testClientToken');
                const savedHeaders = localStorage.getItem('testClientCustomHeaders');
                if (savedServer) serverInput.value = savedServer;
                if (savedToken) tokenInput.value = savedToken;
                if (savedHeaders) customHeadersInput.value = savedHeaders;
            }

            function saveSettings() {
                localStorage.setItem('testClientServer', serverInput.value.trim());
                localStorage.setItem('testClientToken', tokenInput.value.trim());
                localStorage.setItem('testClientCustomHeaders', customHeadersInput.value.trim());
            }

            function clearSettings() {
                localStorage.removeItem('testClientServer');
                localStorage.removeItem('testClientToken');
                localStorage.removeItem('testClientCustomHeaders');
                localStorage.removeItem('testClientHistory');
                serverInput.value = '';
                tokenInput.value = '';
                customHeadersInput.value = '';
                renderHistory();
            }

            // ------------------- История запросов -------------------
            function getHistory() {
                try {
                    return JSON.parse(localStorage.getItem('testClientHistory') || '[]');
                } catch { return []; }
            }

            function saveHistoryEntry(entry) {
                let history = getHistory();
                history.unshift(entry);
                if (history.length > 30) history.pop();

                localStorage.setItem('testClientHistory', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                const history = getHistory();
                historyList.innerHTML = '';
                if (!history.length) {
                    historyList.innerHTML = '<div style="color:#666; text-align:center; padding:12px;">История пуста</div>';
                    return;
                }
                history.forEach((entry, index) => {
                    const wrapper = document.createElement('div');

                    const item = document.createElement('div');
                    item.className = 'history-item';

                    const methodSpan = document.createElement('span');
                    methodSpan.className = 'h-method';
                    methodSpan.textContent = entry.method;

                    const urlSpan = document.createElement('span');
                    urlSpan.className = 'h-url';
                    urlSpan.textContent = entry.url;

                    const statusSpan = document.createElement('span');
                    statusSpan.className = `h-status ${entry.status >= 200 && entry.status < 300 ? 'ok' : 'err'}`;
                    statusSpan.textContent = entry.status;

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'h-time';
                    timeSpan.textContent = entry.time + ' мс';

                    item.appendChild(methodSpan);
                    item.appendChild(urlSpan);
                    item.appendChild(statusSpan);
                    item.appendChild(timeSpan);

                    // Детали (по клику)
                    const detail = document.createElement('div');
                    detail.className = 'history-detail hidden';
                    let detailText = '';
                    if (entry.body) {
                        detailText += 'Запрос:\n' + JSON.stringify(entry.body, null, 2) + '\n\n';
                    }
                    if (entry.responseBody) {
                        detailText += 'Ответ:\n' + entry.responseBody;
                    }
                    detail.textContent = detailText || 'Нет данных';

                    item.addEventListener('click', function() {
                        detail.classList.toggle('hidden');
                    });

                    wrapper.appendChild(item);
                    wrapper.appendChild(detail);
                    historyList.appendChild(wrapper);
                });
            }

            // ------------------- Подсветка JSON -------------------
            function syntaxHighlight(json) {
                json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                    var cls = 'number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'key';
                        } else {
                            cls = 'string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'boolean';
                    } else if (/null/.test(match)) {
                        cls = 'null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
            }

            // ------------------- Извлечение параметров из URL -------------------
            function extractParams(urlTemplate) {
                const regex = /\{([^}]+)\}/g;
                const matches = [...urlTemplate.matchAll(regex)];
                return matches.map(m => m[1]);
            }

            // ------------------- Построение интерфейса -------------------
            function buildEndpoints() {
                container.innerHTML = '';
                // Группируем по категории
                const groups = {};
                ENDPOINTS.forEach(ep => {
                    if (!groups[ep.category]) groups[ep.category] = [];
                    groups[ep.category].push(ep);
                });

                // Для каждой категории создаём блок-аккордеон
                Object.keys(groups).forEach(category => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'group';

                    // Заголовок группы
                    const header = document.createElement('div');
                    header.className = 'group-header';
                    const title = document.createElement('h3');
                    title.textContent = category;
                    const icon = document.createElement('span');
                    icon.className = 'toggle-icon';
                    icon.textContent = '▼';
                    header.appendChild(title);
                    header.appendChild(icon);
                    groupDiv.appendChild(header);

                    // Тело группы (сетка карточек)
                    const body = document.createElement('div');
                    body.className = 'group-body';
                    // По умолчанию раскрыто
                    body.classList.remove('hidden');

                    // Добавляем карточки для каждого эндпоинта в группе
                    groups[category].forEach((ep, idx) => {
                        const card = document.createElement('div');
                        card.className = 'endpoint-card';

                        // Заголовок карточки
                        const cardHeader = document.createElement('div');
                        cardHeader.className = 'endpoint-header';
                        const methodSpan = document.createElement('span');
                        methodSpan.className = `method ${ep.method.toLowerCase()}`;
                        methodSpan.textContent = ep.method;
                        const urlSpan = document.createElement('span');
                        urlSpan.className = 'url';
                        urlSpan.textContent = ep.url;
                        cardHeader.appendChild(methodSpan);
                        cardHeader.appendChild(urlSpan);
                        card.appendChild(cardHeader);

                        const desc = document.createElement('div');
                        desc.className = 'description';
                        desc.textContent = ep.description + (ep.needsAuth ? '' : ' (без токена)');
                        card.appendChild(desc);

                        // Параметры
                        const params = extractParams(ep.url);
                        const paramsContainer = document.createElement('div');
                        paramsContainer.className = 'params-area';
                        const paramInputs = {};
                        if (params.length) {
                            params.forEach(p => {
                                const wrapper = document.createElement('div');
                                wrapper.className = 'param';
                                const label = document.createElement('label');
                                label.textContent = p + ':';
                                const input = document.createElement('input');
                                input.type = 'text';
                                input.placeholder = p;
                                // Уникальный идентификатор для каждого поля
                                const uid = `param_${category}_${idx}_${p}`.replace(/\s/g, '');
                                input.id = uid;
                                paramInputs[p] = input;
                                wrapper.appendChild(label);
                                wrapper.appendChild(input);
                                paramsContainer.appendChild(wrapper);
                            });
                            card.appendChild(paramsContainer);
                        }

                        // Тело запроса
                        let bodyTextarea = null;
                        if (ep.bodyRequired) {
                            const bodyArea = document.createElement('div');
                            bodyArea.className = 'body-area';
                            const textarea = document.createElement('textarea');
                            textarea.placeholder = 'JSON тело запроса';
                            const uidBody = `body_${category}_${idx}`.replace(/\s/g, '');
                            textarea.id = uidBody;
                            bodyArea.appendChild(textarea);

                            const toolbar = document.createElement('div');
                            toolbar.className = 'toolbar';
                            const exampleBtn = document.createElement('button');
                            exampleBtn.className = 'btn btn-secondary';
                            exampleBtn.textContent = '📋 Пример';
                            exampleBtn.type = 'button';
                            exampleBtn.addEventListener('click', function() {
                                const example = BODY_EXAMPLES[ep.url];
                                if (example) {
                                    textarea.value = JSON.stringify(example, null, 2);
                                } else {
                                    textarea.value = '{}';
                                }
                            });
                            toolbar.appendChild(exampleBtn);
                            bodyArea.appendChild(toolbar);
                            card.appendChild(bodyArea);
                            bodyTextarea = textarea;
                        }

                        // Кнопки и статус
                        const row = document.createElement('div');
                        row.className = 'button-row';
                        const sendBtn = document.createElement('button');
                        sendBtn.className = 'btn';
                        sendBtn.textContent = '🚀 Отправить';
                        const loadingSpan = document.createElement('span');
                        loadingSpan.className = 'loading hidden';
                        row.appendChild(sendBtn);
                        row.appendChild(loadingSpan);
                        card.appendChild(row);

                        // Блок ответа
                        const responseBlock = document.createElement('div');
                        responseBlock.className = 'response-block hidden';
                        card.appendChild(responseBlock);

                        body.appendChild(card);

                        // ------------------- Обработчик отправки -------------------
                        sendBtn.addEventListener('click', async function() {
                            const server = serverInput.value.trim();
                            if (!server) {
                                alert('Укажите адрес сервера');
                                return;
                            }

                            const token = tokenInput.value.trim();
                            if (ep.needsAuth && !token) {
                                alert('Для этого запроса требуется токен. Получите его через /login или /register.');
                                return;
                            }

                            // Собираем параметры
                            let url = ep.url;
                            let hasEmptyParam = false;
                            params.forEach(p => {
                                const val = paramInputs[p]?.value?.trim() || '';
                                if (!val) {
                                    hasEmptyParam = true;
                                }
                                url = url.replace(`{${p}}`, encodeURIComponent(val));
                            });
                            if (hasEmptyParam) {
                                alert('Заполните все параметры (поля с плейсхолдерами)');
                                return;
                            }

                            // Тело
                            let body = null;
                            if (ep.bodyRequired && bodyTextarea) {
                                const raw = bodyTextarea.value.trim();
                                if (!raw) {
                                    alert('Тело запроса не может быть пустым. Используйте кнопку "Пример" или введите JSON.');
                                    return;
                                }
                                try {
                                    body = JSON.parse(raw);
                                } catch (e) {
                                    alert('Некорректный JSON в теле запроса');
                                    return;
                                }
                            } else if (ep.bodyRequired) {
                                body = {};
                            }

                            const fullUrl = server + url;

                            loadingSpan.classList.remove('hidden');
                            sendBtn.disabled = true;

                            const startTime = performance.now();

                            try {
                                // Кастомные заголовки
                                let customHeaders = {};
                                const customHeadersRaw = customHeadersInput.value.trim();
                                if (customHeadersRaw) {
                                    try {
                                        customHeaders = JSON.parse(customHeadersRaw);
                                    } catch {
                                        alert('Некорректный JSON в дополнительных заголовках');
                                        loadingSpan.classList.add('hidden');
                                        sendBtn.disabled = false;
                                        return;
                                    }
                                }

                                const headers = {
                                    'Content-Type': 'application/json',
                                    ...customHeaders
                                };
                                if (ep.needsAuth && token) {
                                    headers['Authorization'] = `Bearer ${token}`;
                                }

                                const fetchOptions = {
                                    method: ep.method,
                                    headers: headers
                                };
                                if (body !== null) {
                                    fetchOptions.body = JSON.stringify(body);
                                }

                                const response = await fetch(fullUrl, fetchOptions);

                                const elapsed = (performance.now() - startTime).toFixed(0);
                                let responseData;
                                const contentType = response.headers.get('content-type');
                                if (contentType && contentType.includes('application/json')) {
                                    responseData = await response.json();
                                } else {
                                    responseData = await response.text();
                                }

                                const version = response.headers.get('X-App-Version') || 'неизвестно';
                                const responseBodyStr = typeof responseData === 'string' ? responseData : JSON.stringify(responseData, null, 2);

                                saveHistoryEntry({
                                    method: ep.method,
                                    url: fullUrl,
                                    status: response.status,
                                    time: elapsed,
                                    body: body,
                                    responseBody: responseBodyStr.length > 2000 ? responseBodyStr.substring(0, 2000) + '...' : responseBodyStr
                                });

                                // Если login или register — сохраняем токен
                                if ((ep.url === '/api/auth/login' || ep.url === '/api/auth/register') && response.ok) {
                                    if (responseData && responseData.data && responseData.data.token) {
                                        const newToken = responseData.data.token;
                                        tokenInput.value = newToken;
                                        localStorage.setItem('testClientToken', newToken);
                                        alert('✅ Токен автоматически сохранён!');
                                    }
                                }

                                if (response.status === 429) {
                                    alert('Превышен лимит запросов. Подождите и попробуйте снова.');
                                }

                                if (response.status === 413) {
                                    alert('Превышен максимальный размер тела запроса.');
                                }

                                responseBlock.classList.remove('hidden');
                                responseBlock.className = 'response-block' + (response.ok ? '' : ' error');
                                let statusText = `${response.status} ${response.statusText}`;
                                if (response.ok) {
                                    statusText = `<span class="status-ok">${statusText}</span>`;
                                } else {
                                    statusText = `<span class="status-bad">${statusText}</span>`;
                                }

                                let formattedBody = '';
                                if (typeof responseData === 'string') {
                                    try {
                                        const parsed = JSON.parse(responseData);
                                        formattedBody = syntaxHighlight(JSON.stringify(parsed, null, 2));
                                    } catch {
                                        formattedBody = responseData;
                                    }
                                } else {
                                    formattedBody = syntaxHighlight(JSON.stringify(responseData, null, 2));
                                }

                                responseBlock.innerHTML = `
                                    <div class="status">${statusText} <span class="time">⏱ ${elapsed} мс | Версия API: ${version}</span></div>
                                    <div class="body">${formattedBody}</div>
                                `;
                            } catch (error) {
                                responseBlock.classList.remove('hidden');
                                responseBlock.className = 'response-block error';
                                responseBlock.innerHTML = `
                                    <div class="status"><span class="status-bad">Ошибка сети</span></div>
                                    <div class="body">${error.message}</div>
                                `;
                            } finally {
                                loadingSpan.classList.add('hidden');
                                sendBtn.disabled = false;
                            }
                        });
                    });

                    groupDiv.appendChild(body);

                    // Обработчик сворачивания/разворачивания группы
                    header.addEventListener('click', function() {
                        const isHidden = body.classList.toggle('hidden');
                        icon.textContent = isHidden ? '▶' : '▼';
                    });

                    container.appendChild(groupDiv);
                });
            }

            // ------------------- Инициализация -------------------
            loadSettings();
            buildEndpoints();
            renderHistory();

            saveBtn.addEventListener('click', saveSettings);
            clearBtn.addEventListener('click', function() {
                clearSettings();
                renderHistory();
            });

            serverInput.addEventListener('change', saveSettings);
            tokenInput.addEventListener('change', saveSettings);
            customHeadersInput.addEventListener('change', saveSettings);
        })();
    </script>
</body>
</html>

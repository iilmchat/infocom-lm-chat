<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый клиент API Менеджер ИТ-проектов (v1.2)</title>
    <style>
        /* Тёмная тема, адаптивный дизайн */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #ffffff;
            margin-bottom: 16px;
        }
        .settings {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .settings label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 200px;
            color: #b0b0b0;
            font-size: 14px;
        }
        .settings input {
            background: #2c2c2c;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        .settings input:focus {
            outline: none;
            border-color: #6a9fb5;
        }
        .btn {
            background: #2a4c5a;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            background: #3a6a7a;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: #3a3a3a;
        }
        .btn-secondary:hover {
            background: #4a4a4a;
        }
        .endpoint-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        .endpoint-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #4a6a7a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .endpoint-header {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .method {
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            background: #2a4c5a;
            color: #b8d8e8;
        }
        .method.get { background: #2a5a4a; color: #a0d8b0; }
        .method.post { background: #5a4a2a; color: #e8d8a0; }
        .url {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #b0b0b0;
            word-break: break-all;
        }
        .description {
            font-size: 14px;
            color: #c0c0c0;
            margin: 4px 0;
        }
        .params-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .params-area .param {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #2a2a2a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .params-area .param label {
            color: #a0a0a0;
        }
        .params-area .param input {
            background: #121212;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            width: 120px;
            font-size: 13px;
        }
        .body-area {
            margin: 6px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .body-area textarea {
            width: 100%;
            background: #121212;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
        }
        .body-area .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .button-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 6px;
        }
        .response-block {
            background: #0d0d0d;
            border-radius: 4px;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #2a2a2a;
            overflow-x: auto;
            font-size: 13px;
        }
        .response-block .status {
            font-weight: bold;
            margin-bottom: 4px;
        }
        .response-block .time {
            color: #888;
            font-size: 12px;
        }
        .response-block .body {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Consolas', monospace;
            color: #b8d8e8;
        }
        .response-block.error {
            border-color: #6a2a2a;
        }
        .response-block.error .body {
            color: #e8a0a0;
        }
        .status-ok { color: #6fcf97; }
        .status-bad { color: #f28b82; }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #3a6a7a;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }

        .history-section {
            margin-top: 30px;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 16px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            background: #252525;
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-left: 3px solid #4a6a7a;
            cursor: pointer;
        }
        .history-item:hover {
            background: #2f2f2f;
        }
        .history-item .h-method {
            font-weight: bold;
            margin-right: 8px;
        }
        .history-item .h-url {
            color: #a0b0c0;
            flex: 1;
            margin: 0 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item .h-status {
            font-weight: bold;
        }
        .history-item .h-status.ok { color: #6fcf97; }
        .history-item .h-status.err { color: #f28b82; }
        .history-item .h-time {
            color: #888;
            font-size: 12px;
            margin-left: 12px;
        }

        @media (max-width: 600px) {
            .endpoint-grid { grid-template-columns: 1fr; }
            .settings { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Тестовый клиент API (v1.2)</h1>
        <div class="settings">
            <label>Адрес сервера
                <input type="text" id="serverUrl" placeholder="https://localhost:5001" />
            </label>
            <label>Токен (Bearer)
                <input type="text" id="token" placeholder="Введите токен" />
            </label>
            <button class="btn" id="saveSettingsBtn">💾 Сохранить</button>
            <button class="btn btn-secondary" id="clearSettingsBtn">🧹 Очистить</button>
        </div>

        <div id="endpointsContainer"></div>

        <!-- История запросов -->
        <div class="history-section" id="historySection">
            <h2>📜 История запросов</h2>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script>
        (function() {
            // ------------------- Конфигурация эндпоинтов (добавлены v1.2) -------------------
            const ENDPOINTS = [
                // Auth (эти методы НЕ требуют токена)
                { method: 'POST', url: '/api/auth/register', description: 'Регистрация', bodyRequired: true, needsAuth: false },
                { method: 'POST', url: '/api/auth/login', description: 'Вход', bodyRequired: true, needsAuth: false },
                { method: 'GET', url: '/api/auth/sessions?userId={userId}', description: 'Сессии пользователя', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/auth/sessions/end?sessionId={sessionId}', description: 'Завершить сессию', bodyRequired: true, needsAuth: true },
                { method: 'POST', url: '/api/auth/logout-all', description: 'Выйти из всех устройств', bodyRequired: true, needsAuth: true },

                // Projects
                { method: 'GET', url: '/api/projects', description: 'Список проектов (с пагинацией, v1.2)', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/projects', description: 'Создать проект', bodyRequired: true, needsAuth: true },
                { method: 'GET', url: '/api/projects/{id}', description: 'Детали проекта', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/projects/{id}/update', description: 'Обновить проект', bodyRequired: true, needsAuth: true },
                { method: 'POST', url: '/api/projects/{id}/delete', description: 'Удалить проект', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/projects/{id}/close', description: 'Закрыть проект', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/projects/{id}/copy', description: 'Копировать проект', bodyRequired: true, needsAuth: true },
                { method: 'POST', url: '/api/projects/{id}/restore', description: 'Восстановить проект (v1.2)', bodyRequired: false, needsAuth: true },

                // Owners
                { method: 'GET', url: '/api/projects/{projectId}/owners', description: 'Владельцы проекта', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/projects/{projectId}/owners', description: 'Добавить владельца', bodyRequired: true, needsAuth: true },
                { method: 'POST', url: '/api/projects/{projectId}/owners/{ownerId}/remove', description: 'Удалить владельца', bodyRequired: false, needsAuth: true },

                // Documents (с версионированием v1)
                { method: 'GET', url: '/api/v1/projects/{projectId}/documents', description: 'Все версии документов (v1)', bodyRequired: false, needsAuth: true },
                { method: 'GET', url: '/api/projects/{projectId}/documents/active', description: 'Активные документы', bodyRequired: false, needsAuth: true },
                { method: 'GET', url: '/api/projects/{projectId}/documents/versions?type={type}', description: 'Версии по типу', bodyRequired: false, needsAuth: true },
                { method: 'GET', url: '/api/projects/{projectId}/documents/{documentId}', description: 'Конкретный документ', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/projects/{projectId}/documents', description: 'Создать документ', bodyRequired: true, needsAuth: true },
                { method: 'POST', url: '/api/projects/{projectId}/documents/{documentId}/update', description: 'Обновить документ', bodyRequired: true, needsAuth: true },
                { method: 'POST', url: '/api/projects/{projectId}/documents/{documentId}/accept', description: 'Принять документ', bodyRequired: false, needsAuth: true },
                { method: 'POST', url: '/api/projects/{projectId}/documents/{documentId}/delete', description: 'Удалить документ', bodyRequired: false, needsAuth: true },
                // Поиск (v1.2)
                { method: 'GET', url: '/api/projects/{projectId}/documents/search?query={query}', description: 'Поиск по документам (v1.2)', bodyRequired: false, needsAuth: true }
            ];

            // Примеры тел для эндпоинтов (для кнопки "Пример")
            const BODY_EXAMPLES = {
                '/api/auth/register': { "username": "testuser", "password": "password123" },
                '/api/auth/login': { "username": "testuser", "password": "password123" },
                '/api/auth/sessions/end': { "userId": 1 },
                '/api/auth/logout-all': { "userId": 1 },
                '/api/projects': { "name": "Новый проект" },
                '/api/projects/{id}/update': { "name": "Обновлённое имя" },
                '/api/projects/{id}/copy': { "newName": "Копия проекта" },
                '/api/projects/{projectId}/owners': { "userId": 2 },
                '/api/projects/{projectId}/documents': { "type": "ИД", "title": "Техническое задание", "content": "Содержание..." },
                '/api/v1/projects/{projectId}/documents': { "type": "ИД", "title": "Техническое задание", "content": "Содержание..." },
                '/api/projects/{projectId}/documents/{documentId}/update': { "title": "Новый заголовок", "content": "Новое содержание" },
                '/api/projects/{projectId}/documents/{documentId}/accept': {},
                '/api/auth/sessions/end': { "userId": 1 }
            };

            // ------------------- DOM элементы -------------------
            const serverInput = document.getElementById('serverUrl');
            const tokenInput = document.getElementById('token');
            const saveBtn = document.getElementById('saveSettingsBtn');
            const clearBtn = document.getElementById('clearSettingsBtn');
            const container = document.getElementById('endpointsContainer');
            const historyList = document.getElementById('historyList');

            // ------------------- Работа с localStorage -------------------
            function loadSettings() {
                const savedServer = localStorage.getItem('testClientServer');
                const savedToken = localStorage.getItem('testClientToken');
                if (savedServer) serverInput.value = savedServer;
                if (savedToken) tokenInput.value = savedToken;
            }

            function saveSettings() {
                localStorage.setItem('testClientServer', serverInput.value.trim());
                localStorage.setItem('testClientToken', tokenInput.value.trim());
                // обновим заголовки у всех будущих запросов
            }

            function clearSettings() {
                localStorage.removeItem('testClientServer');
                localStorage.removeItem('testClientToken');
                serverInput.value = '';
                tokenInput.value = '';
                localStorage.removeItem('testClientHistory');
                renderHistory();
            }                
            
            // ------------------- История запросов -------------------
            function getHistory() {
                try {
                    return JSON.parse(localStorage.getItem('testClientHistory') || '[]');
                } catch { return []; }
            }

            function saveHistoryEntry(entry) {
                let history = getHistory();
                history.unshift(entry);
                if (history.length > 10) history.pop();
                localStorage.setItem('testClientHistory', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                const history = getHistory();
                historyList.innerHTML = '';
                if (!history.length) {
                    historyList.innerHTML = '<div style="color:#666; text-align:center; padding:12px;">История пуста</div>';
                    return;
                }
                history.forEach((entry, index) => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    const methodSpan = document.createElement('span');
                    methodSpan.className = 'h-method';
                    methodSpan.textContent = entry.method;
                    const urlSpan = document.createElement('span');
                    urlSpan.className = 'h-url';
                    urlSpan.textContent = entry.url;
                    const statusSpan = document.createElement('span');
                    statusSpan.className = `h-status ${entry.status >= 200 && entry.status < 300 ? 'ok' : 'err'}`;
                    statusSpan.textContent = entry.status;
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'h-time';
                    timeSpan.textContent = entry.time + ' мс';
                    item.appendChild(methodSpan);
                    item.appendChild(urlSpan);
                    item.appendChild(statusSpan);
                    item.appendChild(timeSpan);
                    // По клику можно повторить запрос (пока просто выводим в консоль)
                    item.title = 'Нажмите, чтобы скопировать URL в буфер';
                    item.addEventListener('click', function() {
                        navigator.clipboard?.writeText(entry.url).catch(() => {});
                    });
                    historyList.appendChild(item);
                });
            }

            // ------------------- Функция для извлечения параметров из URL шаблона -------------------
            function extractParams(urlTemplate) {
                const regex = /\{([^}]+)\}/g;
                const matches = [...urlTemplate.matchAll(regex)];
                return matches.map(m => m[1]);
            }

            // ------------------- Построение интерфейса -------------------
            function buildEndpoints() {
                container.innerHTML = '';
                ENDPOINTS.forEach((ep, index) => {
                    const card = document.createElement('div');
                    card.className = 'endpoint-card';

                    // Заголовок
                    const header = document.createElement('div');
                    header.className = 'endpoint-header';
                    const methodSpan = document.createElement('span');
                    methodSpan.className = `method ${ep.method.toLowerCase()}`;
                    methodSpan.textContent = ep.method;
                    const urlSpan = document.createElement('span');
                    urlSpan.className = 'url';
                    urlSpan.textContent = ep.url;
                    header.appendChild(methodSpan);
                    header.appendChild(urlSpan);
                    card.appendChild(header);

                    const desc = document.createElement('div');
                    desc.className = 'description';
                    desc.textContent = ep.description + (ep.needsAuth ? '' : ' (без токена)');
                    card.appendChild(desc);

                    // Параметры
                    const params = extractParams(ep.url);
                    const paramsContainer = document.createElement('div');
                    paramsContainer.className = 'params-area';
                    const paramInputs = {};
                    if (params.length) {
                        params.forEach(p => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'param';
                            const label = document.createElement('label');
                            label.textContent = p + ':';
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.placeholder = p;
                            input.id = `param_${index}_${p}`;
                            paramInputs[p] = input;
                            wrapper.appendChild(label);
                            wrapper.appendChild(input);
                            paramsContainer.appendChild(wrapper);
                        });
                        card.appendChild(paramsContainer);
                    }

                    // Тело запроса (если требуется)
                    let bodyTextarea = null;
                    if (ep.bodyRequired) {
                        const bodyArea = document.createElement('div');
                        bodyArea.className = 'body-area';
                        const textarea = document.createElement('textarea');
                        textarea.placeholder = 'JSON тело запроса';
                        textarea.id = `body_${index}`;
                        bodyArea.appendChild(textarea);

                        // Кнопка "Пример"
                        const toolbar = document.createElement('div');
                        toolbar.className = 'toolbar';
                        const exampleBtn = document.createElement('button');
                        exampleBtn.className = 'btn btn-secondary';
                        exampleBtn.textContent = '📋 Пример';
                        exampleBtn.type = 'button';
                        exampleBtn.addEventListener('click', function() {
                            const example = BODY_EXAMPLES[ep.url];
                            if (example) {
                                textarea.value = JSON.stringify(example, null, 2);
                            } else {
                                textarea.value = '{}';
                            }
                        });
                        toolbar.appendChild(exampleBtn);
                        bodyArea.appendChild(toolbar);
                        card.appendChild(bodyArea);
                        bodyTextarea = textarea;
                    }

                    // Кнопки и статус
                    const row = document.createElement('div');
                    row.className = 'button-row';
                    const sendBtn = document.createElement('button');
                    sendBtn.className = 'btn';
                    sendBtn.textContent = '🚀 Отправить';
                    const loadingSpan = document.createElement('span');
                    loadingSpan.className = 'loading hidden';
                    row.appendChild(sendBtn);
                    row.appendChild(loadingSpan);
                    card.appendChild(row);

                    // Блок ответа
                    const responseBlock = document.createElement('div');
                    responseBlock.className = 'response-block hidden';
                    card.appendChild(responseBlock);

                    container.appendChild(card);

                    // ------------------- Обработчик отправки -------------------
                    sendBtn.addEventListener('click', async function() {
                        const server = serverInput.value.trim();
                        if (!server) {
                            alert('Укажите адрес сервера');
                            return;
                        }

                        // Токен нужен только для защищённых методов
                        const token = tokenInput.value.trim();
                        if (ep.needsAuth && !token) {
                            alert('Для этого запроса требуется токен. Получите его через /login или /register.');
                            return;
                        }

                        // Собираем параметры
                        let url = ep.url;
                        let hasEmptyParam = false;
                        params.forEach(p => {
                            const val = paramInputs[p]?.value?.trim() || '';
                            if (!val) {
                                hasEmptyParam = true;
                            }
                            url = url.replace(`{${p}}`, encodeURIComponent(val));
                        });
                        if (hasEmptyParam) {
                            alert('Заполните все параметры (поля с плейсхолдерами)');
                            return;
                        }

                        // Тело
                        let body = null;
                        if (ep.bodyRequired && bodyTextarea) {
                            const raw = bodyTextarea.value.trim();
                            if (!raw) {
                                alert('Тело запроса не может быть пустым. Используйте кнопку "Пример" или введите JSON.');
                                return;
                            }
                                try {
                                    body = JSON.parse(raw);
                                } catch (e) {
                                    alert('Некорректный JSON в теле запроса');
                                    return;
                                }
                        } else if (ep.bodyRequired) {
                            // Если тело требуется, но textarea почему-то нет (ошибка), задаём пустой объект
                            body = {};
                        }

                        const fullUrl = server + url;

                        // Показываем загрузку
                        loadingSpan.classList.remove('hidden');
                        sendBtn.disabled = true;

                        const startTime = performance.now();

                        try {
                            const headers = {
                                'Content-Type': 'application/json'
                            };
                            // Добавляем Authorization только если нужен токен
                            if (ep.needsAuth && token) {
                                headers['Authorization'] = `Bearer ${token}`;
                            }

                            const fetchOptions = {
                                method: ep.method,
                                headers: headers
                            };
                            if (body !== null) {
                                fetchOptions.body = JSON.stringify(body);
                            }

                            const response = await fetch(fullUrl, fetchOptions);
                            const elapsed = (performance.now() - startTime).toFixed(0);
                            let responseData;
                            const contentType = response.headers.get('content-type');
                            if (contentType && contentType.includes('application/json')) {
                                responseData = await response.json();
                            } else {
                                responseData = await response.text();
                            }

                            // Сохраняем в историю
                            saveHistoryEntry({
                                method: ep.method,
                                url: fullUrl,
                                status: response.status,
                                time: elapsed
                            });

                            // Если это login или register и ответ успешный - автоматически сохраняем токен
                            if ((ep.url === '/api/auth/login' || ep.url === '/api/auth/register') && response.ok) {
                                if (responseData && responseData.data && responseData.data.token) {
                                    const newToken = responseData.data.token;
                                    tokenInput.value = newToken;
                                    localStorage.setItem('testClientToken', newToken);
                                    // Можно показать уведомление
                                    alert('✅ Токен автоматически сохранён!');
                                }
                            }

                            // Отображаем ответ
                            responseBlock.classList.remove('hidden');
                            responseBlock.className = 'response-block' + (response.ok ? '' : ' error');
                            let statusText = `${response.status} ${response.statusText}`;
                            if (response.ok) {
                                statusText = `<span class="status-ok">${statusText}</span>`;
                            } else {
                                statusText = `<span class="status-bad">${statusText}</span>`;
                            }
                            responseBlock.innerHTML = `
                                <div class="status">${statusText} <span class="time">⏱ ${elapsed} мс</span></div>
                                <div class="body">${typeof responseData === 'string' ? responseData : JSON.stringify(responseData, null, 2)}</div>
                            `;
                        } catch (error) {
                            responseBlock.classList.remove('hidden');
                            responseBlock.className = 'response-block error';
                            responseBlock.innerHTML = `
                                <div class="status"><span class="status-bad">Ошибка сети</span></div>
                                <div class="body">${error.message}</div>
                            `;
                        } finally {
                            loadingSpan.classList.add('hidden');
                            sendBtn.disabled = false;
                        }
                    });
                });
            }

            // ------------------- Инициализация -------------------
            loadSettings();
            buildEndpoints();
            renderHistory();

            saveBtn.addEventListener('click', saveSettings);
            clearBtn.addEventListener('click', function() {
                clearSettings();
                // Перестроить историю (она очистится)
                renderHistory();
            });

            // Автосохранение при изменении полей
            serverInput.addEventListener('change', saveSettings);
            tokenInput.addEventListener('change', saveSettings);

        })();
    </script>
</body>
</html>

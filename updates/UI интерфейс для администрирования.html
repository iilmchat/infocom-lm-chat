<!-- Панель администрирования -->
<div class="admin-panel">
    <!-- Вкладки -->
    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="users">👥 Пользователи</button>
        <button class="admin-tab" data-tab="rooms">💬 Комнаты</button>
        <button class="admin-tab" data-tab="messages">📝 Сообщения</button>
        <button class="admin-tab" data-tab="settings">⚙️ Настройки</button>
        <button class="admin-tab" data-tab="logs">📋 Логи</button>
    </div>

    <!-- Вкладка Пользователи -->
    <div class="admin-tab-content" id="tab-users">
        <div class="admin-search">
            <input type="text" id="adminUserSearch" placeholder="🔍 Поиск пользователей...">
            <button id="adminUserRefresh">🔄</button>
        </div>
        <div class="admin-user-list" id="adminUserList">
            <!-- Карточки пользователей -->
        </div>
    </div>

    <!-- Вкладка Комнаты -->
    <div class="admin-tab-content" id="tab-rooms" style="display:none;">
        <div class="admin-room-list" id="adminRoomList">
            <!-- Список комнат -->
        </div>
    </div>

    <!-- Вкладка Сообщения -->
    <div class="admin-tab-content" id="tab-messages" style="display:none;">
        <div class="admin-search">
            <input type="text" id="adminMsgSearch" placeholder="🔍 Поиск сообщений...">
            <button id="adminMsgSearchBtn">🔍</button>
        </div>
        <div class="admin-message-list" id="adminMessageList">
            <!-- Результаты поиска -->
        </div>
    </div>

    <!-- Вкладка Настройки -->
    <div class="admin-tab-content" id="tab-settings" style="display:none;">
        <div class="admin-settings-grid">
            <div class="setting-item">
                <label>Макс. длина сообщения</label>
                <input type="number" id="settingMaxLength" value="10000">
            </div>
            <div class="setting-item">
                <label>Макс. пользователей в комнате</label>
                <input type="number" id="settingMaxUsers" value="50">
            </div>
            <div class="setting-item">
                <label>Таймаут неактивности (мин)</label>
                <input type="number" id="settingInactiveTimeout" value="5">
            </div>
            <button id="settingSaveBtn">💾 Сохранить</button>
        </div>
    </div>

    <!-- Вкладка Логи -->
    <div class="admin-tab-content" id="tab-logs" style="display:none;">
        <div class="admin-log-list" id="adminLogList">
            <!-- Логи системы -->
        </div>
        <button id="adminLogClear">🗑️ Очистить логи</button>
    </div>
</div>
